<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda partagé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
</head>
<body>
  <header class="masthead">
    <p class="kicker"> Sémaphore : actus Art Numérique de l'agglo Grenobloise  </p>
    <h1>Agenda&nbsp;partagé</h1>
    <p class="sub">Ce qui se prépare, épinglé au fil des jours par celles et ceux qui font vivre l'agenda.</p>
  </header>

  <section class="controls" id="controls" hidden>
    <div class="control-group">
      <label>Trier</label>
      <div class="seg" id="sort" role="group" aria-label="Trier les événements">
        <button data-sort="date" aria-pressed="true">Par date</button>
        <button data-sort="cat" aria-pressed="false">Par genre</button>
      </div>
    </div>
    <div class="control-group" style="flex:1; min-width:240px;">
      <label>Filtrer par genre</label>
      <div class="chips" id="filters"></div>
    </div>
  </section>

  <div class="skeleton" id="loading">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>

  <main id="main" hidden></main>

  <div class="state" id="error" hidden></div>

  <footer id="footer" hidden>
    <span id="meta"></span>
    <span>Lecture seule · mis à jour régulièrement</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
